<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        #log {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>简单的模块加载测试</h1>
    
    <button onclick="test1()">测试 1: 直接调用 window.startTest</button>
    <button onclick="test2()">测试 2: 延迟调用</button>
    <button onclick="test3()">测试 3: 检查函数存在</button>
    
    <div id="log"></div>

    <script>
        function addLog(message, type = 'info') {
            const log = document.getElementById('log');
            const line = document.createElement('div');
            line.className = type;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(line);
            console.log(message);
        }

        addLog('页面加载完成', 'info');
        addLog('等待模块加载...', 'info');

        // 等待 2 秒后测试
        setTimeout(() => {
            addLog('等待 2 秒后的检查...', 'info');
            checkFunctions();
        }, 2000);

        // 等待 5 秒后再次测试
        setTimeout(() => {
            addLog('等待 5 秒后的检查...', 'info');
            checkFunctions();
        }, 5000);

        function checkFunctions() {
            const functions = ['startTest', 'showRecords', 'resetHome', 'submitAnswer'];
            addLog('检查全局函数:', 'info');
            functions.forEach(func => {
                if (window[func]) {
                    addLog(`✓ window.${func} 存在 (类型: ${typeof window[func]})`, 'success');
                } else {
                    addLog(`✗ window.${func} 不存在`, 'error');
                }
            });
        }

        function test1() {
            addLog('测试 1: 直接调用 window.startTest', 'info');
            try {
                if (window.startTest) {
                    addLog('✓ 找到 startTest 函数', 'success');
                    window.startTest();
                    addLog('✓ startTest 调用完成', 'success');
                } else {
                    addLog('✗ startTest 函数不存在', 'error');
                }
            } catch (error) {
                addLog(`✗ 错误: ${error.message}`, 'error');
                addLog(`错误堆栈: ${error.stack}`, 'error');
            }
        }

        function test2() {
            addLog('测试 2: 延迟调用', 'info');
            setTimeout(() => {
                if (window.startTest) {
                    addLog('✓ 1 秒后找到 startTest 函数', 'success');
                    window.startTest();
                } else {
                    addLog('✗ 1 秒后 startTest 函数仍不存在', 'error');
                }
            }, 1000);
        }

        function test3() {
            addLog('测试 3: 检查函数存在', 'info');
            const startTest = window.startTest;
            if (startTest) {
                addLog(`✓ startTest 存在`, 'success');
                addLog(`  函数类型: ${typeof startTest}`, 'info');
                addLog(`  函数长度: ${startTest.length}`, 'info');
                addLog(`  函数源码: ${startTest.toString().substring(0, 100)}...`, 'info');
            } else {
                addLog(`✗ startTest 不存在`, 'error');
            }
        }

        // 监听 DOMContentLoaded
        document.addEventListener('DOMContentLoaded', () => {
            addLog('DOMContentLoaded 事件触发', 'info');
        });

        // 监听 window.onload
        window.onload = () => {
            addLog('window.onload 事件触发', 'info');
        };

        // 监听所有错误
        window.onerror = function(message, source, lineno, colno, error) {
            addLog(`全局错误: ${message}`, 'error');
            addLog(`  位置: ${source}:${lineno}:${colno}`, 'error');
            if (error) {
                addLog(`  堆栈: ${error.stack}`, 'error');
            }
        };

        // 监听未处理的 Promise 拒绝
        window.addEventListener('unhandledrejection', function(event) {
            addLog(`未处理的 Promise 拒绝: ${event.reason}`, 'error');
        });
    </script>
</body>
</html>
