<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美化效果预览 - 小学数学题库</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>📚 小学数学题库测试</h1>

        <!-- 首页预览 -->
        <div class="page active">
            <div class="input-group">
                <label>🎯 选择年级</label>
                <select>
                    <option>三年级</option>
                </select>
            </div>
            <div class="input-group">
                <label>⭐ 选择难度</label>
                <select>
                    <option>提高</option>
                </select>
            </div>
            <div class="input-group">
                <label>📝 题目数量</label>
                <input type="number" value="20">
            </div>
            <div class="input-group checkbox-group">
                <input type="checkbox" id="timer">
                <label for="timer">⏱️ 启用总计时器</label>
            </div>
            <button class="btn btn-primary">🚀 开始测试</button>
            <button class="btn btn-secondary">📊 查看历史记录</button>
        </div>

        <div style="margin-top: 40px; padding: 20px; background: #f9fafb; border-radius: 12px; border: 2px dashed #e5e7eb;">
            <h3 style="color: #6366f1; margin-bottom: 16px;">✨ 美化亮点</h3>
            <ul style="line-height: 2; color: #4b5563;">
                <li>🎨 现代化的渐变配色方案</li>
                <li>💫 流畅的动画效果（滑入、弹跳、脉冲）</li>
                <li>🌈 背景浮动光圈装饰</li>
                <li>✓✗ 清晰的成功/失败反馈</li>
                <li>⏱️ 时间警告脉冲动画</li>
                <li>🎯 儿童友好的大字号设计</li>
                <li>📱 优化的移动端体验</li>
                <li>🌟 按钮涟漪点击效果</li>
            </ul>
        </div>

        <div style="margin-top: 30px; text-align: center; color: #9ca3af; font-size: 14px;">
            <p>📁 备份文件: css/style_backup.css</p>
            <p>🎨 美化文件: css/style_beautified.css</p>
            <p>📖 详细说明: BEAUTIFICATION_GUIDE.md</p>
        </div>
    </div>
</body>
</html>
