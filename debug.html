<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制台调试</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .log {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
        .info {
            color: blue;
        }
    </style>
</head>
<body>
    <h1>控制台调试</h1>
    <div id="logs"></div>

    <script type="module">
        const logsDiv = document.getElementById('logs');
        
        function log(message, type = 'info') {
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logDiv);
            console.log(message);
        }

        log('开始调试...', 'info');

        // 测试模块导入
        try {
            log('测试导入 utils.js...', 'info');
            import('./js/utils.js').then(utils => {
                log('✓ utils.js 导入成功', 'success');
                log(`  - generateUUID: ${typeof utils.generateUUID}`, 'info');
                log(`  - playAlarm: ${typeof utils.playAlarm}`, 'info');
                log(`  - formatTime: ${typeof utils.formatTime}`, 'info');
            }).catch(err => {
                log(`✗ utils.js 导入失败: ${err.message}`, 'error');
            });
        } catch (error) {
            log(`✗ 导入 utils.js 时出错: ${error.message}`, 'error');
        }

        try {
            log('测试导入 questionGenerator.js...', 'info');
            import('./js/questionGenerator.js').then(qg => {
                log('✓ questionGenerator.js 导入成功', 'success');
                log(`  - generateAddSubtraction: ${typeof qg.generateAddSubtraction}`, 'info');
                log(`  - generateMultiplication: ${typeof qg.generateMultiplication}`, 'info');
                log(`  - generateComposite: ${typeof qg.generateComposite}`, 'info');
                log(`  - generateQuestions: ${typeof qg.generateQuestions}`, 'info');
            }).catch(err => {
                log(`✗ questionGenerator.js 导入失败: ${err.message}`, 'error');
            });
        } catch (error) {
            log(`✗ 导入 questionGenerator.js 时出错: ${error.message}`, 'error');
        }

        try {
            log('测试导入 state.js...', 'info');
            import('./js/state.js').then(state => {
                log('✓ state.js 导入成功', 'success');
                log(`  - resetTestState: ${typeof state.resetTestState}`, 'info');
            }).catch(err => {
                log(`✗ state.js 导入失败: ${err.message}`, 'error');
            });
        } catch (error) {
            log(`✗ 导入 state.js 时出错: ${error.message}`, 'error');
        }

        try {
            log('测试导入 timer.js...', 'info');
            import('./js/timer.js').then(timer => {
                log('✓ timer.js 导入成功', 'success');
                log(`  - startTimer: ${typeof timer.startTimer}`, 'info');
                log(`  - stopTimer: ${typeof timer.stopTimer}`, 'info');
            }).catch(err => {
                log(`✗ timer.js 导入失败: ${err.message}`, 'error');
            });
        } catch (error) {
            log(`✗ 导入 timer.js 时出错: ${error.message}`, 'error');
        }

        try {
            log('测试导入 storage.js...', 'info');
            import('./js/storage.js').then(storage => {
                log('✓ storage.js 导入成功', 'success');
                log(`  - saveTestRecord: ${typeof storage.saveTestRecord}`, 'info');
                log(`  - loadRecords: ${typeof storage.loadRecords}`, 'info');
                log(`  - deleteRecord: ${typeof storage.deleteRecord}`, 'info');
            }).catch(err => {
                log(`✗ storage.js 导入失败: ${err.message}`, 'error');
            });
        } catch (error) {
            log(`✗ 导入 storage.js 时出错: ${error.message}`, 'error');
        }

        try {
            log('测试导入 ui.js...', 'info');
            import('./js/ui.js').then(ui => {
                log('✓ ui.js 导入成功', 'success');
                log(`  - showPage: ${typeof ui.showPage}`, 'info');
                log(`  - resetHome: ${typeof ui.resetHome}`, 'info');
                log(`  - showFeedback: ${typeof ui.showFeedback}`, 'info');
            }).catch(err => {
                log(`✗ ui.js 导入失败: ${err.message}`, 'error');
            });
        } catch (error) {
            log(`✗ 导入 ui.js 时出错: ${error.message}`, 'error');
        }

        try {
            log('测试导入 quiz.js...', 'info');
            import('./js/quiz.js').then(quiz => {
                log('✓ quiz.js 导入成功', 'success');
                log(`  - submitAnswer: ${typeof quiz.submitAnswer}`, 'info');
                log(`  - modifyAnswer: ${typeof quiz.modifyAnswer}`, 'info');
                log(`  - nextQuestion: ${typeof quiz.nextQuestion}`, 'info');
            }).catch(err => {
                log(`✗ quiz.js 导入失败: ${err.message}`, 'error');
            });
        } catch (error) {
            log(`✗ 导入 quiz.js 时出错: ${error.message}`, 'error');
        }

        try {
            log('测试导入 test.js...', 'info');
            import('./js/test.js').then(test => {
                log('✓ test.js 导入成功', 'success');
                log(`  - startTest: ${typeof test.startTest}`, 'info');
                log(`  - showQuestion: ${typeof test.showQuestion}`, 'info');
                log(`  - showResult: ${typeof test.showResult}`, 'info');
            }).catch(err => {
                log(`✗ test.js 导入失败: ${err.message}`, 'error');
            });
        } catch (error) {
            log(`✗ 导入 test.js 时出错: ${error.message}`, 'error');
        }

        try {
            log('测试导入 review.js...', 'info');
            import('./js/review.js').then(review => {
                log('✓ review.js 导入成功', 'success');
                log(`  - showResultDetail: ${typeof review.showResultDetail}`, 'info');
                log(`  - showRecords: ${typeof review.showRecords}`, 'info');
            }).catch(err => {
                log(`✗ review.js 导入失败: ${err.message}`, 'error');
            });
        } catch (error) {
            log(`✗ 导入 review.js 时出错: ${error.message}`, 'error');
        }

        // 测试 main.js
        try {
            log('测试导入 main.js...', 'info');
            import('./js/main.js').then(() => {
                log('✓ main.js 导入成功', 'success');
                
                setTimeout(() => {
                    log('检查全局函数...', 'info');
                    const globalFuncs = [
                        'startTest', 'showRecords', 'resetHome', 
                        'submitAnswer', 'modifyAnswer', 'nextQuestion',
                        'showResultDetail', 'closeDetailModal', 'deleteCurrentRecord'
                    ];
                    
                    globalFuncs.forEach(funcName => {
                        if (window[funcName]) {
                            log(`✓ window.${funcName} 存在`, 'success');
                        } else {
                            log(`✗ window.${funcName} 不存在`, 'error');
                        }
                    });
                }, 500);
            }).catch(err => {
                log(`✗ main.js 导入失败: ${err.message}`, 'error');
            });
        } catch (error) {
            log(`✗ 导入 main.js 时出错: ${error.message}`, 'error');
        }

        log('调试完成', 'info');
    </script>
</body>
</html>
