<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学数学题库测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            min-height: 500px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 16px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="number"].error {
            border-color: #ff6b6b;
            background-color: #fff5f5;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #fa5252;
        }

        .question-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .timer-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .timer-progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.1s linear;
        }

        .timer-text {
            text-align: center;
            font-size: 24px;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .timer-text.warning {
            color: #ffa502;
        }

        .timer-text.danger {
            color: #ff6b6b;
        }

        .feedback {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 18px;
            font-weight: 600;
            display: none;
        }

        .feedback.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .feedback.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #666;
            font-size: 16px;
        }

        .score-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .final-score {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
        }

        .score-detail {
            color: #666;
            font-size: 20px;
            margin-top: 10px;
        }

        .records-list {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .record-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .record-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .record-date {
            font-weight: 600;
            color: #333;
        }

        .record-score {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .record-detail {
            color: #666;
            font-size: 14px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }

        .question-review {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .question-review.correct {
            border-left: 4px solid #28a745;
        }

        .question-review.incorrect {
            border-left: 4px solid #dc3545;
            background: #fff5f5;
            border: 2px solid #ff6b6b;
            box-shadow: 0 2px 8px rgba(255, 107, 107, 0.2);
        }

        .question-review.incorrect .review-question {
            color: #dc3545;
        }

        .review-question {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .review-answer {
            font-size: 14px;
            color: #666;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .delete-record-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        .delete-record-btn:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .question-text {
                font-size: 36px;
            }

            .final-score {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>小学数学题库测试</h1>

        <!-- 首页 -->
        <div id="homePage" class="page active">
            <div class="input-group">
                <label>题目数量 (N)</label>
                <input type="number" id="questionCount" min="1" max="100" value="20">
            </div>
            <div class="input-group checkbox-group">
                <input type="checkbox" id="enableTimer">
                <label for="enableTimer">启用总计时器</label>
            </div>
            <button class="btn btn-primary" onclick="startTest()">开始测试</button>
            <button class="btn btn-secondary" onclick="showRecords()">查看历史记录</button>
        </div>

        <!-- 答题页 -->
        <div id="quizPage" class="page">
            <div class="progress-info">
                <span>第 <span id="currentQuestionNum">1</span> 题 / 共 <span id="totalQuestions">20</span> 题</span>
                <span>当前得分: <span id="currentScore">0</span></span>
            </div>
            <div class="question-display">
                <div class="question-text" id="questionText">2 + 3 =</div>
                <div class="timer-bar">
                    <div class="timer-progress" id="timerProgress"></div>
                </div>
                <div class="timer-text" id="timerText">30秒</div>
            </div>
            <div class="input-group">
                <input type="number" id="answerInput" placeholder="请输入答案" onkeypress="handleKeyPress(event)">
            </div>
            <button class="btn btn-primary" onclick="submitAnswer()">提交答案</button>
            <button class="btn btn-secondary" id="modifyBtn" onclick="modifyAnswer()" style="display: none;">修改答案</button>
            <button class="btn btn-secondary" id="nextBtn" onclick="nextQuestion()" style="display: none;">下一题</button>
            <div class="feedback" id="feedback"></div>
        </div>

        <!-- 结果页 -->
        <div id="resultPage" class="page">
            <div class="score-display">
                <div class="final-score" id="finalScore">100</div>
                <div class="score-detail">
                    <span id="correctCount">20</span> / <span id="totalCount">20</span> 题正确
                </div>
            </div>
            <div class="score-detail" id="totalTimeDisplay">总用时: 0分0秒</div>
            <button class="btn btn-primary" onclick="showResultDetail()">查看详情</button>
            <button class="btn btn-secondary" onclick="resetHome()">重新测试</button>
            <button class="btn btn-secondary" onclick="showRecords()">查看历史记录</button>
        </div>

        <!-- 历史记录页 -->
        <div id="recordsPage" class="page">
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterRecords('all')">全部</button>
                <button class="filter-btn" onclick="filterRecords('addition')">加减法</button>
                <button class="filter-btn" onclick="filterRecords('multiplication')">乘法</button>
                <button class="filter-btn" onclick="filterRecords('composite')">复合运算</button>
                <button class="filter-btn" onclick="filterRecords('wrong')">错题集</button>
            </div>
            <div class="records-list" id="recordsList"></div>
            <button class="btn btn-secondary" onclick="resetHome()" style="margin-top: 20px;">返回首页</button>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">答题详情</h2>
                <button class="close-btn" onclick="closeDetailModal()">&times;</button>
            </div>
            <div id="detailContent"></div>
            <button class="btn btn-danger" onclick="deleteCurrentRecord()" style="margin-top: 20px;">删除记录</button>
        </div>
    </div>

    <script>
        let currentTest = {
            questions: [],
            currentIndex: 0,
            correctCount: 0,
            answers: [],
            startTime: null,
            enableTimer: false
        };

        let currentTimer = null;
        let timeLeft = 0;
        let maxTime = 0;
        let totalTimeTimer = null;
        let currentRecordId = null;

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playAlarm() {
            audioContext.resume();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function generateAddSubtraction() {
            const isAddition = Math.random() > 0.5;
            let a, b, answer, question, difficulty;

            if (isAddition) {
                const carry = Math.random() > 0.5;
                if (carry) {
                    a = Math.floor(Math.random() * 50) + 1;
                    b = Math.floor(Math.random() * (100 - a)) + 1;
                } else {
                    a = Math.floor(Math.random() * 9) + 1;
                    b = Math.floor(Math.random() * (10 - a));
                }
                answer = a + b;
                question = `${a} + ${b} =`;
                difficulty = carry ? 2 : 1;
            } else {
                a = Math.floor(Math.random() * 99) + 1;
                b = Math.floor(Math.random() * a);
                const hasBorrow = (a % 10) < (b % 10);
                answer = a - b;
                question = `${a} - ${b} =`;
                difficulty = hasBorrow ? 2 : 1;
            }

            return {
                id: generateUUID(),
                question,
                answer,
                type: 'addition',
                difficulty,
                timeLimit: difficulty === 1 ? 30 : 60
            };
        }

        function generateMultiplication() {
            const a = Math.floor(Math.random() * 9) + 1;
            const b = Math.floor(Math.random() * 9) + 1;
            const answer = a * b;
            const difficulty = (a >= 6 || b >= 6) ? 2 : 1;

            return {
                id: generateUUID(),
                question: `${a} × ${b} =`,
                answer,
                type: 'multiplication',
                difficulty,
                timeLimit: difficulty === 1 ? 30 : 60
            };
        }

        function generateComposite() {
            let question, answer, difficulty;
            const useTwoSteps = Math.random() > 0.3;

            if (useTwoSteps) {
                const template = Math.floor(Math.random() * 6);
                
                switch (template) {
                    case 0:
                        const a = Math.floor(Math.random() * 5) + 1;
                        const b = Math.floor(Math.random() * 5) + 1;
                        const c = Math.floor(Math.random() * 5) + 1;
                        answer = (a + b) * c;
                        question = `(${a} + ${b}) × ${c} =`;
                        break;
                    case 1:
                        const d = Math.floor(Math.random() * 9) + 1;
                        const e = Math.floor(Math.random() * (d)) + 1;
                        const f = Math.floor(Math.random() * 5) + 1;
                        answer = (d - e) + f;
                        question = `(${d} - ${e}) + ${f} =`;
                        break;
                    case 2:
                        const g = Math.floor(Math.random() * 5) + 2;
                        const h = Math.floor(Math.random() * 3) + 1;
                        const product = g * h;
                        const i = Math.floor(Math.random() * (product - 1)) + 1;
                        answer = product - i;
                        question = `${g} × ${h} - ${i} =`;
                        break;
                    case 3:
                        const j = Math.floor(Math.random() * 4) + 1;
                        const k = Math.floor(Math.random() * 4) + 1;
                        const l = Math.floor(Math.random() * 4) + 1;
                        const m = Math.floor(Math.random() * 4) + 1;
                        answer = (j + k) * (l + m);
                        question = `(${j} + ${k}) × (${l} + ${m}) =`;
                        difficulty = 3;
                        break;
                    case 4:
                        const n = Math.floor(Math.random() * 6) + 2;
                        const o = Math.floor(Math.random() * (n - 1)) + 1;
                        const p = Math.floor(Math.random() * 5) + 1;
                        answer = n - o + p;
                        question = `${n} - ${o} + ${p} =`;
                        break;
                    case 5:
                        const q = Math.floor(Math.random() * 4) + 1;
                        const r = Math.floor(Math.random() * 4) + 1;
                        const s = Math.floor(Math.random() * 4) + 1;
                        const t = Math.floor(Math.random() * 4) + 1;
                        const left = q * r;
                        const right = s * t;
                        answer = left + right;
                        question = `${q} × ${r} + ${s} × ${t} =`;
                        break;
                }
                if (!difficulty) difficulty = 2;
            } else {
                const a = Math.floor(Math.random() * 4) + 1;
                const b = Math.floor(Math.random() * 4) + 1;
                const c = Math.floor(Math.random() * 4) + 1;
                const d = Math.floor(Math.random() * 4) + 1;
                
                answer = (a + b) * (c + d);
                question = `(${a} + ${b}) × (${c} + ${d}) =`;
                difficulty = 3;
            }

            return {
                id: generateUUID(),
                question,
                answer,
                type: 'composite',
                difficulty,
                timeLimit: 60
            };
        }

        function calculateOperation(a, b, op) {
            switch (op) {
                case '+':
                    return a + b;
                case '-':
                    return a - b;
                case '×':
                    return a * b;
                default:
                    return a + b;
            }
        }

        function generateQuestions(count) {
            const questions = [];
            const types = ['addition', 'multiplication', 'composite'];
            
            for (let i = 0; i < count; i++) {
                const type = types[Math.floor(Math.random() * types.length)];
                let question;
                
                if (type === 'addition') {
                    question = generateAddSubtraction();
                } else if (type === 'multiplication') {
                    question = generateMultiplication();
                } else {
                    question = generateComposite();
                }
                
                questions.push(question);
            }

            questions.sort((a, b) => a.difficulty - b.difficulty);

            return questions;
        }

        function startTest() {
            const count = parseInt(document.getElementById('questionCount').value);
            if (count < 1 || count > 100) {
                alert('题目数量必须在 1-100 之间');
                return;
            }

            currentTest = {
                questions: generateQuestions(count),
                currentIndex: 0,
                correctCount: 0,
                answers: [],
                startTime: Date.now(),
                enableTimer: document.getElementById('enableTimer').checked
            };

            document.getElementById('homePage').classList.remove('active');
            document.getElementById('quizPage').classList.add('active');
            document.getElementById('totalQuestions').textContent = count;
            document.getElementById('currentScore').textContent = '0';

            showQuestion();
        }

        function showQuestion() {
            const question = currentTest.questions[currentTest.currentIndex];
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('currentQuestionNum').textContent = currentTest.currentIndex + 1;
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').disabled = false;
            document.getElementById('answerInput').classList.remove('error');
            document.getElementById('answerInput').focus();
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('modifyBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            
            startTimer(question.timeLimit);
        }

        function startTimer(seconds) {
            clearInterval(currentTimer);
            maxTime = seconds;
            timeLeft = seconds;
            
            updateTimerDisplay();
            
            currentTimer = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(currentTimer);
                    playAlarm();
                    document.getElementById('timerText').classList.add('danger');
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const progress = (timeLeft / maxTime) * 100;
            document.getElementById('timerProgress').style.width = `${progress}%`;
            document.getElementById('timerText').textContent = `${timeLeft}秒`;
            
            const timerText = document.getElementById('timerText');
            timerText.classList.remove('warning', 'danger');
            
            if (timeLeft <= 10) {
                timerText.classList.add('danger');
            } else if (timeLeft <= 20) {
                timerText.classList.add('warning');
            }
        }

        function submitAnswer() {
            const userAnswer = parseInt(document.getElementById('answerInput').value);
            const question = currentTest.questions[currentTest.currentIndex];
            const isCorrect = userAnswer === question.answer;
            const timeSpent = maxTime - timeLeft;

            currentTest.answers.push({
                questionId: question.id,
                question: question.question,
                userAnswer: userAnswer,
                correctAnswer: question.answer,
                isCorrect: isCorrect,
                type: question.type,
                difficulty: question.difficulty,
                timeLimit: question.timeLimit,
                timeSpent: timeSpent
            });

            clearInterval(currentTimer);
            document.getElementById('answerInput').disabled = true;
            document.getElementById('currentScore').textContent = Math.round(
                (currentTest.correctCount / (currentTest.currentIndex + 1)) * 100
            );

            if (isCorrect) {
                currentTest.correctCount++;
                document.getElementById('feedback').textContent = '✓ 正确！';
                document.getElementById('feedback').classList.add('success');
                document.getElementById('feedback').style.display = 'block';
                document.getElementById('modifyBtn').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'none';
                setTimeout(() => {
                    nextQuestion();
                }, 1000);
            } else {
                document.getElementById('feedback').textContent = '✗ 错误！';
                document.getElementById('feedback').classList.add('error');
                document.getElementById('feedback').style.display = 'block';
                document.getElementById('answerInput').classList.add('error');
                document.getElementById('modifyBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').style.display = 'inline-block';
            }
        }

        function modifyAnswer() {
            const answer = currentTest.answers.pop();
            currentTest.correctCount--;
            document.getElementById('answerInput').value = answer.userAnswer;
            document.getElementById('answerInput').disabled = false;
            document.getElementById('answerInput').classList.remove('error');
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('modifyBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            
            timeLeft = answer.timeLimit - answer.timeSpent;
            maxTime = answer.timeLimit;
            startTimer(timeLeft);
        }

        function nextQuestion() {
            currentTest.currentIndex++;
            
            if (currentTest.currentIndex >= currentTest.questions.length) {
                showResult();
            } else {
                showQuestion();
            }
        }

        function showResult() {
            clearInterval(currentTimer);
            
            const totalTime = Math.round((Date.now() - currentTest.startTime) / 1000);
            const score = Math.round((currentTest.correctCount / currentTest.questions.length) * 100);

            const testRecord = {
                testId: generateUUID(),
                date: new Date().toLocaleString('zh-CN'),
                settings: {
                    questionCount: currentTest.questions.length,
                    enableTimer: currentTest.enableTimer
                },
                totalTime: totalTime,
                score: score,
                correctCount: currentTest.correctCount,
                totalCount: currentTest.questions.length,
                questions: currentTest.answers
            };

            saveTestRecord(testRecord);

            document.getElementById('quizPage').classList.remove('active');
            document.getElementById('resultPage').classList.add('active');
            document.getElementById('finalScore').textContent = score;
            document.getElementById('correctCount').textContent = currentTest.correctCount;
            document.getElementById('totalCount').textContent = currentTest.questions.length;
            
            const minutes = Math.floor(totalTime / 60);
            const seconds = totalTime % 60;
            document.getElementById('totalTimeDisplay').textContent = 
                `总用时: ${minutes}分${seconds}秒`;
            
            currentTest.record = testRecord;
        }

        function saveTestRecord(record) {
            const records = JSON.parse(localStorage.getItem('math_test_records') || '[]');
            records.unshift(record);
            localStorage.setItem('math_test_records', JSON.stringify(records));
        }

        function showResultDetail() {
            if (!currentTest.record) return;
            
            const record = currentTest.record;
            currentRecordId = record.testId;
            
            let html = `
                <p><strong>测试时间：</strong>${record.date}</p>
                <p><strong>题目数量：</strong>${record.settings.questionCount}</p>
                <p><strong>总用时：</strong>${formatTime(record.totalTime)}</p>
                <p><strong>得分：</strong>${record.score}</p>
                <hr style="margin: 20px 0;">
            `;

            record.questions.forEach((q, index) => {
                html += `
                    <div class="question-review ${q.isCorrect ? 'correct' : 'incorrect'}">
                        <div class="review-question">
                            ${q.isCorrect ? '✓' : '✗'} ${index + 1}. ${q.question}
                            ${!q.isCorrect ? '<strong style="color: #dc3545;">（错误）</strong>' : ''}
                        </div>
                        <div class="review-answer">
                            你的答案: ${q.userAnswer} | 
                            正确答案: ${q.correctAnswer} | 
                            用时: ${q.timeSpent.toFixed(1)}秒
                        </div>
                    </div>
                `;
            });

            document.getElementById('detailContent').innerHTML = html;
            document.getElementById('detailModal').classList.add('active');
        }

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${minutes}分${secs}秒`;
        }

        function showRecords(filter = 'all') {
            const records = JSON.parse(localStorage.getItem('math_test_records') || '[]');
            let filteredRecords = records;

            if (filter !== 'all') {
                filteredRecords = records.filter(record => {
                    if (filter === 'wrong') {
                        return record.questions.some(q => !q.isCorrect);
                    }
                    return record.questions.some(q => q.type === filter);
                });
            }

            let html = '';
            if (filteredRecords.length === 0) {
                html = '<p style="text-align: center; color: #999;">暂无记录</p>';
            } else {
                filteredRecords.forEach(record => {
                    html += `
                        <div class="record-item" onclick="showRecordDetail('${record.testId}')">
                            <div class="record-header">
                                <span class="record-date">${record.date}</span>
                                <span class="record-score">${record.score}</span>
                            </div>
                            <div class="record-detail">
                                ${record.correctCount}/${record.totalCount} 题正确 | 
                                用时 ${formatTime(record.totalTime)}
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('recordsList').innerHTML = html;
            document.getElementById('homePage').classList.remove('active');
            document.getElementById('resultPage').classList.remove('active');
            document.getElementById('recordsPage').classList.add('active');

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function showRecordDetail(testId) {
            const records = JSON.parse(localStorage.getItem('math_test_records') || '[]');
            const record = records.find(r => r.testId === testId);
            
            if (!record) return;

            currentRecordId = testId;
            
            let html = `
                <p><strong>测试时间：</strong>${record.date}</p>
                <p><strong>题目数量：</strong>${record.settings.questionCount}</p>
                <p><strong>总用时：</strong>${formatTime(record.totalTime)}</p>
                <p><strong>得分：</strong>${record.score}</p>
                <hr style="margin: 20px 0;">
            `;

            record.questions.forEach((q, index) => {
                html += `
                    <div class="question-review ${q.isCorrect ? 'correct' : 'incorrect'}">
                        <div class="review-question">
                            ${q.isCorrect ? '✓' : '✗'} ${index + 1}. ${q.question}
                            ${!q.isCorrect ? '<strong style="color: #dc3545;">（错误）</strong>' : ''}
                        </div>
                        <div class="review-answer">
                            你的答案: ${q.userAnswer} | 
                            正确答案: ${q.correctAnswer} | 
                            用时: ${q.timeSpent.toFixed(1)}秒
                        </div>
                    </div>
                `;
            });

            document.getElementById('detailContent').innerHTML = html;
            document.getElementById('detailModal').classList.add('active');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function deleteCurrentRecord() {
            if (!currentRecordId) return;
            
            if (!confirm('确定要删除这条记录吗？')) return;

            const records = JSON.parse(localStorage.getItem('math_test_records') || '[]');
            const filtered = records.filter(r => r.testId !== currentRecordId);
            localStorage.setItem('math_test_records', JSON.stringify(filtered));
            
            closeDetailModal();
            showRecords();
        }

        function resetHome() {
            clearInterval(currentTimer);
            document.getElementById('homePage').classList.add('active');
            document.getElementById('quizPage').classList.remove('active');
            document.getElementById('resultPage').classList.remove('active');
            document.getElementById('recordsPage').classList.remove('active');
            document.getElementById('questionCount').value = '20';
            document.getElementById('enableTimer').checked = false;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                if (document.getElementById('modifyBtn').style.display === 'none') {
                    submitAnswer();
                } else {
                    nextQuestion();
                }
            }
        }
    </script>
</body>
</html>
